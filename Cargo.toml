[package]
name = "Platypus-Telemetry"
version = "0.1.0"
edition = "2024"
description = "MQTT telemetry listener that subscribes to IoT device topics and logs the data to files"
license = "GPL-3.0-or-later"
repository = "https://github.com/Master-Thesis-Feedback-for-VI/platypus-telemetry"
keywords = ["mqtt", "telemetry", "iot", "logging"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
clap = { version = "4", features = ["derive"] }
mqtt5 = "0.48"
serde = { version = "1", features = ["derive", "rc"] }
tokio = { version = "1", features = ["full"] }
toml = "1.1"
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
strum = { version = "0.28.0", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"
tui-textarea = "0.7.0"
unicode-width = "0.2"

[lints.clippy]
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
# Duplicate dependency versions come from transitive deps (mqtt5, clap) and
# cannot be aligned from here, so this lint is not actionable.
multiple_crate_versions = "allow"
